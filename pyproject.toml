[project]
name = "arwen"
version = "0.1.0"
description = "A command-line tool for maintaining CalDAV calendars."
authors = [{ name = "Nicolò Sala", email = "me@niceo.org" }]
requires-python = ">=3.14,<3.15"
readme = "README.md"
license = "CC0-1.0"
license-files = ["LICENSE"]
keywords = ["caldav", "calendar", "icalendar", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Scheduling",
    "Typing :: Typed",
]
dependencies = [
    "caldav (>=3.2.1,<4.0.0)",
    "icalendar (>=7.3.0,<8.0.0)",
    "recurring-ical-events (>=3.8.2,<4.0.0)",
    "python-dateutil (>=2.9.0.post0,<3.0.0)",
]

[project.scripts]
arwen = "arwen.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "ruff>=0.16.5,<0.17",
    "pyrefly>=1.2.0",
    "types-python-dateutil>=2.9.0.20260807",
    "pytest-cov>=7.1.0",
    "pre-commit>=4.6.2",
]
audit = ["uv-secure>=0.17.2,<0.18"]

[tool.uv]
# `audit` is deliberately not a default group: CI asks for it explicitly, so
# scanning the lock file costs developers nothing on `uv sync`.
default-groups = ["dev"]

[tool.hatch.build.targets.sdist]
include = ["src/arwen"]

[tool.hatch.build.targets.wheel]
include = ["src/arwen"]

[tool.hatch.build.targets.wheel.sources]
"src/arwen" = "arwen"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
# target-version is intentionally absent: Ruff derives it from
# project.requires-python, so the version is declared in exactly one place.
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "PTH",
          "RET", "ARG", "TC", "ANN", "D", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyrefly]
preset = "strict"
# python-version is intentionally absent: Pyrefly takes it from the
# interpreter, which uv builds from .python-version.
project-includes = ["src", "tests"]
# The repository root is needed so `tests.fake_server` resolves; `src` is the
# import root of the package itself.
search-path = [".", "src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov",
    "--cov-report=term-missing",
]

[tool.coverage.run]
source = ["src/arwen"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
