[project]
name = "arwen"
version = "0.1.0"
description = "A command-line tool for maintaining CalDAV calendars."
authors = [{ name = "Nicolò Sala", email = "me@niceo.org" }]
requires-python = ">=3.14,<3.15"
readme = "README.md"
license = "CC0-1.0"
license-files = ["LICENSE"]
keywords = ["caldav", "calendar", "icalendar", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business :: Scheduling",
    "Typing :: Typed",
]
dependencies = [
    "caldav>=3.2.1",
    "icalendar>=7.3.0",
    "python-dateutil>=2.9.0.post0",
    "recurring-ical-events>=3.8.2",
]

[project.scripts]
arwen = "arwen.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pyrefly>=1.2.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
    "types-python-dateutil>=2.9.0.20260807",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "PTH",
          "RET", "ARG", "TC", "ANN", "D", "RUF", "S", "DTZ", "C90"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"tests/fake_server.py" = ["S311", "S314"]
"tests/test_fake_server.py" = ["S314"]
"tests/test_config.py" = ["S105", "S106"]
"tests/test_dav.py" = ["S106"]
"tests/test_discovery.py" = ["S106"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyrefly]
preset = "strict"
project-includes = ["src", "tests"]
search-path = [".", "src", ".venv/lib/python3.14/site-packages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov",
    "--cov-report=term-missing",
]

[tool.coverage.run]
source = ["src/arwen"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 87
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
