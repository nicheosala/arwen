[project]
name = "arwen"
version = "0.1.0"
description = "A command-line tool for maintaining CalDAV calendars."
authors = [
    { name = "Nicolò Sala", email = "me@niceo.org" },
]
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "caldav (>=3.0,<4.0)",
    "icalendar (>=6.1,<7.0)",
    "recurring-ical-events (>=3.0,<4.0)",
]

[project.scripts]
arwen = "arwen.cli:main"

[tool.poetry]
packages = [{ include = "arwen", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
ruff = "^0.13"
mypy = "^1.19"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "PTH",
          "RET", "ARG", "TC", "ANN", "D", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
files = ["src", "tests"]
warn_unreachable = true
warn_unused_ignores = true
disallow_any_unimported = true
