[project]
name = "arwen"
version = "0.1.0"
description = "A command-line tool for maintaining CalDAV calendars."
authors = [{ name = "Nicolò Sala", email = "me@niceo.org" }]
requires-python = ">=3.14,<3.15"
readme = "README.md"
license = "CC0-1.0"
license-files = ["LICENSE"]
keywords = ["caldav", "calendar", "icalendar", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business :: Scheduling",
    "Typing :: Typed",
]
dependencies = [
    "caldav>=3.2.1",
    "icalendar>=7.3.0",
    "python-dateutil>=2.9.0.post0",
    "recurring-ical-events>=3.8.2",
]

[project.scripts]
arwen = "arwen.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pyrefly>=1.2.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
    "types-python-dateutil>=2.9.0.20260807",
]

# The src/ layout and a package named after the project are exactly what
# uv_build assumes, so no build configuration of its own is needed.
[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
# target-version is intentionally absent: Ruff derives it from
# project.requires-python, so the version is declared in exactly one place.
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "PTH",
          "RET", "ARG", "TC", "ANN", "D", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyrefly]
preset = "strict"
# python-version is intentionally absent: Pyrefly takes it from the
# interpreter, which uv builds from .python-version.
project-includes = ["src", "tests"]
# The repository root is needed so `tests.fake_server` resolves; `src` is the
# import root of the package itself.
search-path = [".", "src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov",
    "--cov-report=term-missing",
]

[tool.coverage.run]
source = ["src/arwen"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
