# Single source of truth for the quality gates.
#
# There is no CI: the gates run locally only. Hooks without `stages` run at
# both commit and push; the slow or network-bound ones (`pytest`, `uv audit`)
# run at push only. A check that is not here does not run anywhere.
#
# Every project-specific hook runs through `uv run --frozen`, so the tool
# versions come from `uv.lock` rather than from a second set of pinned
# revisions that could drift away from the ones developers install.

minimum_pre_commit_version: "4.0.0"

# Both hook types come from a single `pre-commit install`.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      # tests/fixtures/ is a byte-exact corpus: RFC 5545 folds continuation
      # lines with a leading space, and at least one fixture reproduces a real
      # client's mixed CRLF/LF export on purpose. Nothing may rewrite those
      # bytes, or the tests stop testing what they were written to test.
      - id: end-of-file-fixer
        exclude: ^tests/fixtures/
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^tests/fixtures/
      - id: trailing-whitespace
        exclude: ^tests/fixtures/

  - repo: local
    hooks:
      - id: uv-lock-check
        name: uv lock is in sync with pyproject.toml
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false

      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: pyrefly
        name: pyrefly check
        # --min-severity warn makes warnings fail too: the build is not done
        # until the type checker reports zero errors *and* zero warnings.
        entry: uv run --frozen pyrefly check --min-severity warn
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true

      - id: pytest
        name: pytest
        entry: uv run --frozen pytest
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]

      # Depends on the advisory database, not on the code: it can fail with
      # no change on our side, so it runs on every push rather than only when
      # uv.lock changes.
      - id: uv-audit
        name: uv audit
        entry: uv audit --preview-features audit-command
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
