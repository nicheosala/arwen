name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Re-run weekly so a newly published advisory against an unchanged lock file
  # is still caught by the audit job.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  checks:
    name: Lint, format and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: checks

      - name: Install Python and dependencies
        run: uv sync --frozen

      - name: Cache the pre-commit hook environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # The gates themselves live in .pre-commit-config.yaml and are never
      # restated here, so CI and the local hooks cannot drift apart.
      - name: Run the pre-commit gates
        run: uv run --frozen pre-commit run --all-files --show-diff-on-failure --color=always

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: tests

      - name: Install Python and dependencies
        run: uv sync --frozen

      # Too slow for a commit hook, so this is the one gate CI adds on top of
      # pre-commit. The coverage threshold lives in [tool.coverage.report].
      - name: Run the test suite
        run: uv run --frozen pytest

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: audit

      - name: Install uv-secure
        run: uv sync --frozen --only-group audit

      - name: Scan the locked dependencies for known vulnerabilities
        run: uv run --frozen --only-group audit uv-secure
