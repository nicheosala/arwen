# Dependabot has no pre-commit ecosystem, so the one revision in
# .pre-commit-config.yaml that does not come from uv.lock — the pinned
# `pre-commit-hooks` repository — is bumped here instead. Everything else in
# that file runs through `uv run --frozen` and is already Dependabot's job.

name: Update pre-commit hooks

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  UV_FROZEN: "1"

jobs:
  autoupdate:
    name: Bump pinned hook revisions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: autoupdate

      - name: Install Python and dependencies
        run: uv sync --frozen

      - name: Bump the pinned hook revisions
        run: uv run --frozen pre-commit autoupdate

      - name: Stop here if nothing moved
        id: changes
        run: |
          if git diff --quiet -- .pre-commit-config.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Hook revisions are already current."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A new hook version may reformat or newly flag something. Let the first
      # pass apply what it can, then require a clean second pass: a bump that
      # needs a human decision fails this job instead of opening a pull
      # request that silently rewrites the tree.
      - name: Let the new revisions apply their fixes
        if: steps.changes.outputs.changed == 'true'
        continue-on-error: true
        run: uv run --frozen pre-commit run --all-files --color=always

      - name: Require the gates to pass on the result
        if: steps.changes.outputs.changed == 'true'
        run: uv run --frozen pre-commit run --all-files --show-diff-on-failure --color=always

      # GitHub does not start workflow runs for events raised by GITHUB_TOKEN,
      # so this pull request arrives with no CI run against it and main's
      # required checks show as missing. That is why the gates are re-run above
      # before it is opened. The repository owner is exempt from branch
      # protection and can merge it directly; enforcing protection on admins
      # too would mean giving this step a personal access token instead.
      - name: Open or update the pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch=chore/pre-commit-autoupdate
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "ci: bump pinned pre-commit hook revisions"
          git push --force-with-lease --set-upstream origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --head "$branch" \
              --title "ci: bump pinned pre-commit hook revisions" \
              --body "Opened by \`pre-commit autoupdate\`. The gates were re-run across the whole tree on the new revisions and passed.

Main's required checks will show as missing: GitHub does not start workflow runs for pull requests opened with \`GITHUB_TOKEN\`. The run that produced this branch is the verification."
          fi
