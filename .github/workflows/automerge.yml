name: Automerge

# Triggered when CI finishes, not when the pull request opens, so the merge
# only happens once the checks have really passed. With workflow_run the job
# runs in the repository's own context, where the token can write; in
# workflows started by Dependabot's pull requests it is read-only.
#
# Only pull requests from Dependabot and from the nicheosala-deps app, which
# .github/workflows/lock.yml opens, are merged.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      contains(fromJSON('["dependabot[bot]", "nicheosala-deps[bot]"]'), github.event.workflow_run.actor.login) &&
      github.event.workflow_run.pull_requests[0]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Merge the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        # Right after CI finishes, GitHub may not have registered the required
        # checks on the commit yet and refuse the merge: hence a few attempts
        # 15 seconds apart. If they all fail, another pull request usually
        # landed in the meantime: Dependabot rebases its own and CI starts
        # again, while lock.yml recreates the lock one the following Monday.
        run: |
          for _ in 1 2 3 4; do
            gh pr merge "$NUMBER" --squash --delete-branch --repo "$GITHUB_REPOSITORY" && exit 0
            sleep 15
          done
          echo "Merge deferred: the pull request will be updated and CI will run again."
