name: Lock

# Upgrades the whole of uv.lock, transitive dependencies included, before
# Dependabot runs (.github/dependabot.yml starts it on Monday at 08:00).
# Dependabot's version updates only touch direct dependencies: a vulnerable
# transitive one, such as virtualenv under pre-commit, stayed in the lock and
# failed the audit job on every one of its pull requests, so none of them
# merged.
#
# The pull request is opened by the nicheosala-deps GitHub App rather than the
# GITHUB_TOKEN: pull requests opened by the workflow token do not start CI.
# This way CI runs on it just as it does on Dependabot's and, if it is green,
# .github/workflows/automerge.yml merges it.
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

# The GITHUB_TOKEN is not needed: everything goes through the app's token.
permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  lock:
    name: Upgrade uv.lock
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BRANCH: deps/uv-lock-upgrade
    steps:
      # The token lasts an hour, covers this repository only and carries just
      # the two permissions needed, even if the app were granted more.
      - name: App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.LOCK_APP_CLIENT_ID }}
          private-key: ${{ secrets.LOCK_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # Credentials are kept here: they are what pushes the branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app.outputs.token }}

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      # The branch starts over from main every time, so a pull request left
      # open (red CI, or main moving on before the merge) is replaced by the
      # new one. If the lock is already up to date, a pull request left open
      # is obsolete and gets closed.
      - name: Upgrade the lock and open the pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BOT: ${{ steps.app.outputs.app-slug }}[bot]
        run: |
          uv lock --upgrade
          OPEN=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if git diff --quiet uv.lock; then
            echo "uv.lock is already up to date."
            if [ -n "$OPEN" ]; then
              gh pr close "$OPEN" --delete-branch --comment "uv.lock is already up to date on main."
            fi
            exit 0
          fi
          git config user.name "$BOT"
          git config user.email "$(gh api "users/$BOT" --jq .id)+$BOT@users.noreply.github.com"
          git switch -C "$BRANCH"
          git commit -m "deps: uv lock --upgrade" uv.lock
          git push --force origin "$BRANCH"
          if [ -z "$OPEN" ]; then
            gh pr create --base main --head "$BRANCH" --title "deps: uv lock --upgrade" \
              --body "Weekly upgrade of the whole uv.lock, transitive dependencies included (.github/workflows/lock.yml)."
          fi
